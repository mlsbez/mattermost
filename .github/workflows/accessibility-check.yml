name: Accessibility Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libasound2t64

      - name: Install Dependencies
        run: |
          cd webapp
          npm install
          npm install @playwright/test @axe-core/playwright

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers (if needed)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Start Mattermost Server
        run: |
          cd server
          docker-compose up -d
          make run &

      - name: Wait for Server
        run: npx wait-on http://localhost:8065

      - name: Run Accessibility Tests
        id: axe-test
        run: |
          cd webapp
          node scripts/accessibility-test.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: webapp/reports/accessibility-report.json

      - name: Comment on PR if accessibility issues found
        if: failure()
        run: |
          if [[ -f "webapp/reports/accessibility-report.json" ]]; then
            REPORT=$(cat webapp/reports/accessibility-report.json)
            COMMENT_BODY="Accessibility issues detected:\n\`\`\`json\n$REPORT\n\`\`\`"
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"body\": \"$COMMENT_BODY\"}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          else
            echo "Accessibility report not found."
          fi
          